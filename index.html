<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="display-bar">
            <div id="display-bar-text">
                <span class="multilayered-icon">
                    <img id="time-frame-icon" src="img/time_frame.png" alt="time"> 
                    <img id="time-hand-icon" src="img/time_hand.png"> 
                </span>
                <span id="timer">0</span>
            </div>
            <div id="display-bar-text"><img src="img/flag.png" alt="flagged"> <span id="flags">0</span></div>
            <div class="flexbox">
                <button id="config-toggle"><img src="img/config.png" alt="Config"></button>
                <button id="restart"><img src="img/restart.png" alt="Restart"></button>
            </div>
        </div>

        <main id="map"></main>
    </div>

    <div id="panel">
        <div class="dim-screen"></div>
        <div id="panel-main">
            <label for="difficulty">Difficulty</label>
            <select name="difficulty" id="difficulty"></select>
        </div>
    </div>

    <div id="confetti-container"></div>
    <video id="jumpscare" src="vid/fnaf-jumpscare.mp4" autoplay hidden></video>

    <script>



let DEBUG = false;

let chosenDifficulty = 1;
const difficulties = [
    ['Easy', 10, 8, 10],
    ['Medium', 13, 14, 40],
    ['Hard', 24, 24, 99]
]

const body = document.querySelector('body');

const mapElement = document.getElementById('map');
let map = {};
let mapWidth = 0;
let mapHeight = 0;
let totalMines = 0;
let areMinesPlaced = false;

let hasLost = false;
let hasWon = false;
let cellsRevealed = 0;
let cellsFlagged = 0;
let timer = 0;

class Cell{
    isMine = false;
    isRevealed = false;
    isFlagged = false;
    
    constructor(element){
        this.element = element;
    }
}

function clearMap(){
    mapElement.replaceChildren();
    map = {};
}

function populateMapFromChosenDifficulty(){
    const d = difficulties[chosenDifficulty];
    populateMap(d[1], d[2], d[3]);
}

function populateMap(width = 24, height = 24, mines = 99){
    clearMap();

    // Premature checks
    if (width < 2)
        width = 2;
    if (height < 2)
        height = 2;
    if (mines > width * height - 9)
        mines = width * height - 9;

    // Populate the map
    for (let x = 1; x <= width; x++)
        for (let y = 1; y <= height; y++)
            placeCell(x, y);

    mapWidth = width;
    mapHeight = height;
    totalMines = mines;
    areMinesPlaced = false;

    hasLost = false;
    hasWon = false;
    cellsRevealed = 0;
    cellsFlagged = 0;
    resetTimer();
    updateFlagNumber();

    timerText.innerText = timer;
    document.querySelector('body').classList.remove('confetti');
    updateMinPageSize();

    function placeCell(x, y){
        const cell = document.createElement('button');
        cell.style.gridRow = y;
        cell.style.gridColumn = x;
        cell.onclick = () => digAt(x, y);
        cell.oncontextmenu = e => {e.preventDefault(); toggleFlagCellAt(x, y);}
        mapElement.appendChild(cell);

        map[[x, y]] = new Cell(cell);
    }
}

function generateMines(safeX, safeY){
    if (areMinesPlaced)
        return;

    // Place mines
    for (let i = 0; i < totalMines; i++){
        if (!placeMine(
            Math.floor(Math.random() * mapWidth) + 1, 
            Math.floor(Math.random() * mapHeight) + 1))
            i--;
    }

    // Calculate all the surrounding mines around a cell
    for (let x = 1; x <= mapWidth; x++)
        for (let y = 1; y <= mapHeight; y++)
        {
            const cell = map[[x, y]];
            if (cell.isMine)
                continue;

            // TODO: optimise?
            let mines = 0;
            iterateOverSurroundingCells(x, y, (surroundingCell) => {
                if (surroundingCell.isMine)
                        mines++;
            });
            
            cell.surroundingMines = mines;
            if (DEBUG && mines > 0)
                cell.element.innerText = mines;
        }

    areMinesPlaced = true;
    startTimer();

    function placeMine(x, y){
        if (x >= safeX - 1 && x <= safeX + 1 && y >= safeY - 1 && y <= safeY + 1)
            return false;

        const cell = map[[x, y]];
        if (cell.isMine)
            return false;

        cell.isMine = true;
        if (DEBUG) cell.element.setAttribute('class', 'mine');
        return true;
    }
}

function digAt(x, y){
    // Premature checks
    if (mapWidth == 0 || mapHeight == 0)
        return;
    if (x < 1 || x > mapWidth
        || y < 1 || y > mapHeight)
        return;

    // Only generate mines after a user has picked out a spot
    // that way we can guarantee that they get a fair bit of
    // land on start
    if (!areMinesPlaced)
        generateMines(x, y);
    
    // Look up the cell
    const cell = map[[x, y]];
    if (cell.isFlagged)
        return;

    if (cell.isMine)
    {
        cell.isRevealed = true;
        cell.element.setAttribute('class', 'mine');
        cellsFlagged++;
        updateFlagNumber();

        defeat();
        return;
    }

    if (cell.isRevealed){
        // For cells that are already revealed
        // if the supposed mines have been flagged
        // by the user, dig out the supposed empty cells
        // A little shortcut if you say so
        // In minesweeper terms it's called CHORDING

        // Check the surrounding mines and count all the flags
        let flags = 0;
        let unrevealedCells = [];
        iterateOverSurroundingCells(x, y, (surroundingCell, surroundingCellX, surroundingCellY) => {
            if (surroundingCell.isFlagged || (surroundingCell.isMine && surroundingCell.isRevealed))
                flags++;
            else if (!surroundingCell.isRevealed)
                unrevealedCells.push([surroundingCellX, surroundingCellY]);
        });

        // If the flag count corresponds to the number of
        // surrounding mines, dig all the unrevealed cells
        if (flags == cell.surroundingMines)
            unrevealedCells.forEach(cell => {
                digAt(cell[0], cell[1])
            });
    } 
    else revealCell(cell);

    // If empty area
    if (cell.surroundingMines == 0 && !cell.isMine)
        floodRevealCells(x, y);



    function floodRevealCells(x, y){
        iterateOverSurroundingCells(x, y, (surroundingCell, surroundingCellX, surroundingCellY) => {
            if (surroundingCell.isRevealed)
                return;

            revealCell(surroundingCell);
            if (surroundingCell.surroundingMines == 0)
                floodRevealCells(surroundingCellX, surroundingCellY);
        });
    }

    function revealCell(cell){
        if (cell.isRevealed)
            return;

        if (cell.isFlagged)
            toggleFlagCell(cell);
        cell.isRevealed = true;

        cell.element.setAttribute('class', 'revealed');

        if (cell.surroundingMines > 0){
            cell.element.innerText = cell.surroundingMines;
            cell.element.setAttribute('value', cell.surroundingMines);
        }

        cellsRevealed++;
        if (cellsRevealed == mapWidth * mapHeight - totalMines)
            win();
    }
}

function toggleFlagCellAt(x, y){
    // Premature checks
    if (mapWidth == 0 || mapHeight == 0)
        return;
    if (x < 1 || x > mapWidth
        || y < 1 || y > mapHeight)
        return;
    
    // Look up the cell
    const cell = map[[x, y]];
    toggleFlagCell(cell);
}

function toggleFlagCell(cell){
    if (cell.isRevealed)
        return;

    cell.isFlagged = !cell.isFlagged;
    cellsFlagged += cell.isFlagged ? 1 : -1;
    updateFlagNumber();

    // Set the graphics
    if (cell.element.classList.contains('flagged'))
        cell.element.classList.remove('flagged');
    if (cell.isFlagged)
        cell.element.classList.add('flagged');
}

const flagsText = document.getElementById('flags');
function updateFlagNumber(){
    flagsText.textContent = totalMines - cellsFlagged;
}

function updateMinPageSize(){
    const cellSize = parseInt(window.getComputedStyle(document.querySelector('#map>button')).getPropertyValue('--cell-size').replace('px',''));
    const displayBarWidth = document.getElementById('display-bar').offsetWidth;
    
    body.style.minWidth = (cellSize * mapWidth + cellSize * 2 + displayBarWidth) + 'px';
    body.style.minHeight = (cellSize * mapHeight + cellSize * 2) + 'px';
}




const jumpscare = document.getElementById('jumpscare');
const jumpscarePlaybackRate = 1.6;
function defeat(){
    if (hasLost || hasWon)
        return;
    hasLost = true;

    // Display a FNAF jumpscare, cause why not?
    jumpscare.removeAttribute('hidden');
    jumpscare.currentTime = 0;
    jumpscare.playbackRate = jumpscarePlaybackRate;
    jumpscare.play();

    setTimeout(() => {
        jumpscare.pause();
        jumpscare.hidden = true;
    }, (jumpscare.duration * 1000) / jumpscarePlaybackRate);
}

function win(){
    if (hasWon || hasLost)
        return;

    hasWon = true;
    stopTimer();

    playConfetti();
}

const timerText = document.getElementById('timer');
const timerFrameIcon = document.getElementById('time-frame-icon');
const timerHandIcon = document.getElementById('time-hand-icon');
let timerInterval;
function startTimer(){
    timer = 0;

    timerFrameIcon.src = 'img/time_frame.png'

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timer += 0.25;
        timerText.innerText = Math.floor(timer);

        timerHandIcon.style.rotate = (timer * 30) + 'deg';
    }, 250);
}

function stopTimer(){
    clearInterval(timerInterval);
    
    timerFrameIcon.src = 'img/time_frame_pressed.png'
}

function resetTimer(){
    timer = 0;
    stopTimer();

    timerFrameIcon.src = 'img/time_frame.png'
    timerHandIcon.style.rotate = (timer * 30) + 'deg';

    // Disable the transition on the timer's hand so that it instantly goes back into place
    let transition = timerHandIcon.style.transition;
    timerHandIcon.style.transition = '0s';
    setTimeout(() => {
        timerHandIcon.style.transition = transition;
    }, 50);
}




function iterateOverSurroundingCells(x, y, callback){
    for (let offsetX = -1; offsetX < 2; offsetX++)
        for (let offsetY = -1; offsetY < 2; offsetY++)
        {
            if (offsetX == 0 && offsetY == 0)
                continue;

            const surroundingCellX = x + offsetX;
            const surroundingCellY = y + offsetY;
            if (surroundingCellX < 1 || surroundingCellX > mapWidth
                || surroundingCellY < 1 || surroundingCellY > mapHeight)
                continue;

            const surroundingCell = map[[surroundingCellX, surroundingCellY]];
            callback(surroundingCell, surroundingCellX, surroundingCellY);
        }
}


// Restart and populate the map
const restartButton = document.getElementById('restart');
restartButton.addEventListener('click', () => populateMapFromChosenDifficulty());
populateMapFromChosenDifficulty();




// Panel toggle
const panel = document.getElementById('panel');
const panelMain = document.getElementById('panel-main');
const panelToggle = document.getElementById('config-toggle');
const panelDimScreen = document.querySelector('#panel>.dim-screen');

panel.setAttribute('hidden', true);

function togglePanel(){
    if (panel.hasAttribute('hidden'))
        panel.removeAttribute('hidden');
    else panel.setAttribute('hidden', true);
}

panelDimScreen.addEventListener('click', togglePanel);
panelToggle.addEventListener('click', togglePanel);


// Prepare the panel
const difficultyList = document.getElementById('difficulty');

for (let i = 0; i < difficulties.length; i++){
    let difficulty = difficulties[i];

    let element = document.createElement('option');
    element.value = i;
    element.innerText = difficulty[0];

    difficultyList.appendChild(element);
}

difficultyList.addEventListener('change', (e) => {
    console.log(parseInt(e.currentTarget.value));
    chosenDifficulty = parseInt(e.currentTarget.value);
    populateMapFromChosenDifficulty();
});

difficultyList.value = chosenDifficulty;



// Confetti
let confettiContainer = document.getElementById('confetti-container');

function playConfetti(){
    const gravity = 700;
    const particleAmount = 100;

    let animationStartTimestap = 0;
    let lastAnimationTimestamp = 0;
    let animationTime = 0;

    let particles = [];


    for (let i = 0; i < particleAmount/2; i++)
        spawnParticle([0, 0], [randomRange(50, 400), randomRange(150, 600)]);
    for (let i = 0; i < particleAmount/2; i++)
        spawnParticle([window.innerWidth, 0], [-randomRange(50, 400), randomRange(150, 600)]);


    requestAnimationFrame(update);


    function spawnParticle(position, velocity){
        let element = document.createElement('div');
        element.style.width = randomRange(9, 20) + 'px';
        element.style.height = randomRange(9, 20) + 'px';
        element.style.backgroundColor = `rgb(${randomRange(200, 255)}, ${randomRange(200, 255)}, ${randomRange(200, 255)})`;

        confettiContainer.appendChild(element);

        particles.push({
            element: element, 
            position: position, 
            velocity: velocity,
            rotation: randomRange(0, 89)
        });
    }

    function update(timestamp){
        if (animationStartTimestap == 0){
            animationStartTimestap = timestamp;
            lastAnimationTimestamp = timestamp;
        }
        let deltaTime = (timestamp - lastAnimationTimestamp) / 1000;

        animationTime += deltaTime;
        lastAnimationTimestamp = timestamp;


        particles.forEach(particle => updateParticle(particle, deltaTime));


        if (animationTime < 5)
            requestAnimationFrame(update);

        else particles.forEach(particle => {
            // Finish animation
            // Clear all particles
            particles.forEach(particle => confettiContainer.removeChild(particle.element));
        });
    }

    function updateParticle(particle, deltaTime){
        particle.velocity[1] -= gravity * deltaTime;
        particle.position[0] += particle.velocity[0] * deltaTime;
        particle.position[1] -= particle.velocity[1] * deltaTime;

        particle.element.style.transform = `translate(${particle.position[0]}px, ${particle.position[1]}px) rotate(${particle.rotation}deg)`;
    }
}





let randomRange = (from, to) => Math.random() * (to - from) + from;

    </script>
</body>
</html>
